<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Echidna Gallery</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif}
header{padding:22px 16px;text-align:center;background:#181818;position:sticky;top:0;z-index:5}
h1{margin:0 0 6px;font-size:26px}
.sub{color:#999;font-size:13px}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:15px}
button,input{border:0;border-radius:8px;padding:10px 13px}
button{background:#333;color:#fff;cursor:pointer}
button.active{background:#8b5cf6}
input{background:#292929;color:#fff;min-width:190px}
main{padding:16px;max-width:1200px;margin:auto}
.status{text-align:center;color:#aaa;padding:15px}
.grid{columns:2 180px;column-gap:12px}
.card{break-inside:avoid;margin-bottom:12px;background:#1b1b1b;border-radius:10px;overflow:hidden}
.card img{display:block;width:100%;height:auto;background:#222}
.info{padding:9px;font-size:12px;color:#aaa}
.badge{display:inline-block;padding:3px 7px;border-radius:5px;margin-right:5px;color:#fff}
.sfw{background:#287a46}
.nsfw{background:#9b3030}
a{color:#aaa;text-decoration:none}
@media(min-width:700px){.grid{columns:4 180px}}
</style>
</head>

<body>
<header>
<h1>☕ Echidna Gallery</h1>
<div class="sub">Re:Zero · Echidna Fan Gallery</div>

<div class="controls">
<button class="active" data-filter="all">全部</button>
<button data-filter="safe">SFW</button>
<button data-filter="nsfw">NSFW</button>
<input id="search" placeholder="搜索标签 / Search tags">
<button id="load">刷新 / Reload</button>
</div>
</header>

<main>
<div id="status" class="status">正在加载图片…</div>
<div id="grid" class="grid"></div>
</main>

<script>
const API="https://danbooru.donmai.us/posts.json";

let posts=[];
let filter="all";

const grid=document.getElementById("grid");
const status=document.getElementById("status");
const search=document.getElementById("search");

async function loadPosts(){
  status.textContent="正在从图库加载…";
  grid.innerHTML="";

  try{
    const url=API+"?limit=40&tags=echidna_%28re:zero%29";
    const res=await fetch(url);

    if(!res.ok) throw new Error("API "+res.status);

    posts=await res.json();
    render();
  }catch(e){
    console.error(e);
    status.textContent="加载失败，请稍后刷新。";
  }
}

function getRating(post){
  return post.rating || "q";
}

function render(){
  const keyword=search.value.trim().toLowerCase();

  const list=posts.filter(p=>{
    const rating=getRating(p);

    let type=true;
    if(filter==="safe") type=rating==="g" || rating==="s";
    if(filter==="nsfw") type=rating==="q" || rating==="e";

    const tags=(p.tag_string || "").toLowerCase();
    const textMatch=!keyword || tags.includes(keyword);

    return type && textMatch;
  });

  status.textContent=`找到 ${list.length} 张图片`;

  if(!list.length){
    grid.innerHTML='<div class="status">没有找到符合条件的图片</div>';
    return;
  }

  grid.innerHTML=list.map(p=>{
    const rating=getRating(p);
    const isNSFW=rating==="e" || rating==="q";

    const image=p.large_file_url || p.file_url || p.preview_file_url;
    const source=p.source || "Danbooru";

    return `
      <article class="card">
        <a href="https://danbooru.donmai.us/posts/${p.id}" target="_blank" rel="noopener">
          <img src="${image}" loading="lazy" alt="Echidna">
        </a>
        <div class="info">
          <span class="badge ${isNSFW?'nsfw':'sfw'}">
            ${isNSFW?'NSFW':'SFW'}
          </span>
          ⭐ ${p.score ?? 0}
          <br><br>
          来源：
          <a href="${source}" target="_blank" rel="noopener">
            查看原图 / Source
          </a>
        </div>
      </article>
    `;
  }).join("");
}

document.querySelectorAll("[data-filter]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll("[data-filter]").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    filter=btn.dataset.filter;
    render();
  });
});

search.addEventListener("input",render);
document.getElementById("load").addEventListener("click",loadPosts);

loadPosts();
</script>
</body>
</html>
