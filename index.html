<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"> <title>Echidna Gallery</title> <style> *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; } html,body{ margin:0; padding:0; background:#f5f5f5; color:#222; font-family:Arial,"Microsoft YaHei",sans-serif; } body{ overflow-x:hidden; } body.lightbox-open{ overflow:hidden; } header{ position:sticky; top:0; z-index:50; background:rgba(255,255,255,.96); backdrop-filter:blur(10px); border-bottom:1px solid #ddd; padding:14px 12px; } header h1{ margin:0 0 10px; text-align:center; font-size:22px; } .controls{ width:100%; max-width:900px; margin:auto; } .row{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:7px; } button, input{ font-size:14px; border:1px solid #ccc; border-radius:8px; background:#fff; padding:9px 11px; } button{ cursor:pointer; } button:active{ transform:scale(.97); } input{ flex:1 1 180px; min-width:0; outline:none; } button.active{ background:#222; color:#fff; border-color:#222; } main{ width:100%; max-width:900px; margin:0 auto; padding:12px; } .grid{ display:grid; grid-template-columns:1fr; gap:14px; } .card{ width:100%; background:#fff; border-radius:10px; overflow:hidden; border:1px solid #ddd; } .card img{ display:block; width:100%; height:auto; cursor:zoom-in; background:#eee; } .info{ padding:9px; font-size:13px; line-height:1.5; } .links{ display:flex; flex-wrap:wrap; gap:8px; margin-top:5px; } .links a{ color:#1677ff; text-decoration:none; } #loadMore{ display:block; width:100%; margin:18px 0; padding:12px; font-size:15px; } #status{ text-align:center; color:#777; font-size:13px; padding:5px 0 15px; } /* ========================= Lightbox ========================= */ #lightbox{ position:fixed; inset:0; z-index:9999; display:none; background:rgba(0,0,0,.96); overflow:hidden; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); touch-action:none; overscroll-behavior:none; } #lightbox.show{ display:block; } #lightboxViewport{ position:absolute; inset:0; overflow:hidden; touch-action:none; } #lightboxImage{ position:absolute; left:50%; top:50%; width:auto; height:auto; max-width:none; max-height:none; transform-origin:center center; user-select:none; -webkit-user-drag:none; touch-action:none; will-change:transform; } #closeLightbox{ position:absolute; z-index:20; top:calc(10px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right)); width:42px; height:42px; border:0; border-radius:50%; background:rgba(255,255,255,.18); color:#fff; font-size:25px; line-height:42px; padding:0; backdrop-filter:blur(5px); } #lightboxHint{ position:absolute; z-index:20; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom)); color:rgba(255,255,255,.75); background:rgba(0,0,0,.4); padding:6px 10px; border-radius:20px; font-size:12px; white-space:nowrap; pointer-events:none; } /* 手机竖屏专门优化 */ @media(max-width:600px){ header{ padding:10px 8px; } header h1{ font-size:20px; margin-bottom:8px; } .row{ gap:5px; margin-bottom:5px; } button, input{ font-size:13px; padding:8px 9px; } main{ padding:8px; } .grid{ gap:10px; } .card{ border-radius:8px; } .info{ padding:8px; } #lightboxHint{ font-size:11px; } } </style> </head> <body> <header> <h1>🌿 Echidna Gallery</h1> <div class="controls"> <div class="row"> <button class="rating active" data-rating="all">全部</button> <button class="rating" data-rating="safe">SFW</button> <button class="rating" data-rating="nsfw">NSFW</button> <button id="blockedBtn">🚫 已拉黑</button> <button id="clearBlocked">清空拉黑</button> </div> <div class="row"> <button class="category active" data-cat="all">全部</button> <button class="category" data-cat="solo">单人</button> <button class="category" data-cat="multiple">多人</button> <button class="category" data-cat="swimsuit">泳装</button> <button class="category" data-cat="maid">女仆</button> <button class="category" data-cat="kimono">和服</button> <button class="category" data-cat="school">校服</button> <button class="category" data-cat="comic">漫画</button> <button class="category" data-cat="cosplay">Cosplay</button> </div> <div class="row"> <input id="tagSearch" placeholder="输入标签，例如 swimsuit"> <button id="searchBtn">搜索</button> <button id="resetBtn">重置</button> </div> </div> </header> <main> <div id="status">准备加载…</div> <div id="grid" class="grid"></div> <button id="loadMore">加载更多</button> </main> <!-- Lightbox --> <div id="lightbox"> <button id="closeLightbox">×</button> <div id="lightboxViewport"> <img id="lightboxImage" draggable="false"> </div> <div id="lightboxHint"> 双指缩放 · 单指拖动 · 双击放大 </div> </div> <script> const API = "https://danbooru.donmai.us/posts.json"; const MAIN_TAG = "echidna_%28re:zero%29"; const PER_PAGE = 100; const PAGES_PER_CLICK = 5; let page = 1; let posts = []; let ratingFilter = "all"; let categoryFilter = "all"; let searchTag = ""; let showBlocked = false; const blockedKey = "echidnaBlockedIds"; let blockedIds = JSON.parse(localStorage.getItem(blockedKey) || "[]"); const grid = document.getElementById("grid"); const status = document.getElementById("status"); /* ========================= 工具 ========================= */ function saveBlocked(){ localStorage.setItem( blockedKey, JSON.stringify(blockedIds) ); } function isBlocked(id){ return blockedIds.includes(String(id)); } function getRating(post){ if(post.rating === "s" || post.rating === "g"){ return "safe"; } if(post.rating === "q" || post.rating === "e"){ return "nsfw"; } return "safe"; } function getTags(post){ return " " + (post.tag_string || "") + " "; } function matchCategory(post){ if(categoryFilter === "all"){ return true; } const tags = getTags(post); if(categoryFilter === "solo"){ return tags.includes(" solo "); } if(categoryFilter === "multiple"){ return ( tags.includes(" multiple_girls ") || tags.includes(" multiple_boys ") || tags.includes(" multiple_person ") || tags.includes(" group ") ); } if(categoryFilter === "swimsuit"){ return ( tags.includes(" swimsuit ") || tags.includes(" bikini ") ); } if(categoryFilter === "maid"){ return tags.includes(" maid "); } if(categoryFilter === "kimono"){ return ( tags.includes(" kimono ") || tags.includes(" yukata ") ); } if(categoryFilter === "school"){ return ( tags.includes(" school_uniform ") || tags.includes(" serafuku ") || tags.includes(" seifuku ") ); } if(categoryFilter === "comic"){ return ( tags.includes(" comic ") || tags.includes(" comic_page ") || tags.includes(" manga ") ); } if(categoryFilter === "cosplay"){ return tags.includes(" cosplay "); } return true; } function shouldShow(post){ if(showBlocked){ if(!isBlocked(post.id)){ return false; } }else{ if(isBlocked(post.id)){ return false; } } if( ratingFilter !== "all" && getRating(post) !== ratingFilter ){ return false; } if(!matchCategory(post)){ return false; } if(searchTag){ const tags = (post.tag_string || "").toLowerCase(); if(!tags.includes(searchTag.toLowerCase())){ return false; } } return true; } /* ========================= 渲染 ========================= */ function render(){ grid.innerHTML = ""; const visible = posts.filter(shouldShow); visible.forEach(post => { const card = document.createElement("div"); card.className = "card"; const img = document.createElement("img"); const imageUrl = post.large_file_url || post.file_url || post.preview_file_url; img.src = imageUrl; img.loading = "lazy"; img.dataset.full = imageUrl; img.dataset.id = post.id; card.appendChild(img); const info = document.createElement("div"); info.className = "info"; const rating = getRating(post) === "safe" ? "SFW" : "NSFW"; info.innerHTML = ` <div>ID: ${post.id}</div> <div>Rating: ${rating}</div> <div class="links"> <a href="https://danbooru.donmai.us/posts/${post.id}" target="_blank" rel="noopener" > Original Post </a> ${ post.source ? ` <a href="${post.source}" target="_blank" rel="noopener" > Source </a> ` : "" } <a href="#" class="blockBtn" data-id="${post.id}" > 🚫 拉黑 </a> </div> `; card.appendChild(info); grid.appendChild(card); }); status.textContent = `显示 ${visible.length} 张 · 已加载 ${posts.length} 张`; } /* ========================= 拉黑 ========================= */ grid.addEventListener("click", e => { const blockBtn = e.target.closest(".blockBtn"); if(blockBtn){ e.preventDefault(); const id = String(blockBtn.dataset.id); if(!blockedIds.includes(id)){ blockedIds.push(id); } saveBlocked(); render(); return; } const img = e.target.closest(".card img"); if(img){ openLightbox(img.dataset.full); } }); document .getElementById("clearBlocked") .addEventListener("click", () => { blockedIds = []; saveBlocked(); showBlocked = false; document .getElementById("blockedBtn") .textContent = "🚫 已拉黑"; render(); }); document .getElementById("blockedBtn") .addEventListener("click", () => { showBlocked = !showBlocked; document .getElementById("blockedBtn") .textContent = showBlocked ? "返回图库" : "🚫 已拉黑"; render(); }); /* ========================= 筛选 ========================= */ document .querySelectorAll(".rating") .forEach(btn => { btn.addEventListener("click", () => { document .querySelectorAll(".rating") .forEach(b => b.classList.remove("active") ); btn.classList.add("active"); ratingFilter = btn.dataset.rating; render(); }); }); document .querySelectorAll(".category") .forEach(btn => { btn.addEventListener("click", () => { document .querySelectorAll(".category") .forEach(b => b.classList.remove("active") ); btn.classList.add("active"); categoryFilter = btn.dataset.cat; render(); }); }); document .getElementById("searchBtn") .addEventListener("click", () => { searchTag = document .getElementById("tagSearch") .value .trim(); render(); }); document .getElementById("resetBtn") .addEventListener("click", () => { searchTag = ""; document .getElementById("tagSearch") .value = ""; render(); }); /* ========================= 加载 Danbooru ========================= */ async function loadMore(){ const startPage = page; status.textContent = "正在加载…"; let newPosts = []; try{ for( let p = startPage; p < startPage + PAGES_PER_CLICK; p++ ){ const url = `${API}?tags=${MAIN_TAG}&limit=${PER_PAGE}&page=${p}`; const response = await fetch(url); if(!response.ok){ throw new Error("API error"); } const data = await response.json(); newPosts.push(...data); if(data.length < PER_PAGE){ break; } } page += PAGES_PER_CLICK; const map = new Map(); [...posts, ...newPosts] .forEach(post => map.set(post.id, post) ); posts = [...map.values()]; render(); }catch(error){ console.error(error); status.textContent = "加载失败，请稍后重试"; } } document .getElementById("loadMore") .addEventListener("click", loadMore); /* ========================= Lightbox ========================= */ const lightbox = document.getElementById("lightbox"); const viewport = document.getElementById("lightboxViewport"); const lightboxImage = document.getElementById("lightboxImage"); const closeLightboxBtn = document.getElementById("closeLightbox"); let baseScale = 1; let zoom = 1; let posX = 0; let posY = 0; let pointers = new Map(); let pinchStartDistance = 0; let pinchStartZoom = 1; let dragging = false; let dragStartX = 0; let dragStartY = 0; let startPosX = 0; let startPosY = 0; let lastTapTime = 0; let lastTapX = 0; let lastTapY = 0; /* 核心： 根据手机屏幕计算「完整显示」比例 */ function calculateBaseScale(){ if(!lightboxImage.naturalWidth || !lightboxImage.naturalHeight){ return; } const vw = window.innerWidth; const vh = window.innerHeight; /* 给关闭按钮和底部提示留空间 */ const availableWidth = Math.max(1, vw - 20); const availableHeight = Math.max(1, vh - 70); const widthScale = availableWidth / lightboxImage.naturalWidth; const heightScale = availableHeight / lightboxImage.naturalHeight; /* 关键： 宽高两个方向都取较小值， 所以整张图一定能放进屏幕。 */ baseScale = Math.min( widthScale, heightScale, 1 ); } function getScaledSize(){ return { width: lightboxImage.naturalWidth * baseScale * zoom, height: lightboxImage.naturalHeight * baseScale * zoom }; } function clampPosition(){ const size = getScaledSize(); const vw = window.innerWidth; const vh = window.innerHeight; const maxX = Math.max( 0, (size.width - vw) / 2 ); const maxY = Math.max( 0, (size.height - vh) / 2 ); posX = Math.max( -maxX, Math.min(maxX, posX) ); posY = Math.max( -maxY, Math.min(maxY, posY) ); } function updateImage(){ clampPosition(); /* 这里非常关键： 必须使用 baseScale * zoom 而不是只使用 zoom。 */ lightboxImage.style.transform = ` translate(-50%, -50%) translate(${posX}px, ${posY}px) scale(${baseScale * zoom}) `; } function openLightbox(url){ lightbox.classList.add("show"); document.body.classList.add("lightbox-open"); zoom = 1; posX = 0; posY = 0; lightboxImage.src = url; lightboxImage.onload = () => { calculateBaseScale(); zoom = 1; posX = 0; posY = 0; updateImage(); }; } function closeLightbox(){ lightbox.classList.remove("show"); document.body.classList.remove("lightbox-open"); lightboxImage.src = ""; pointers.clear(); dragging = false; } closeLightboxBtn .addEventListener("click", closeLightbox); lightbox.addEventListener("click", e => { if(e.target === lightbox || e.target === viewport){ closeLightbox(); } }); /* ========================= 鼠标 / 手指 ========================= */ viewport.addEventListener( "pointerdown", e => { e.preventDefault(); pointers.set( e.pointerId, { x:e.clientX, y:e.clientY } ); viewport.setPointerCapture(e.pointerId); if(pointers.size === 1){ dragging = true; dragStartX = e.clientX; dragStartY = e.clientY; startPosX = posX; startPosY = posY; } if(pointers.size === 2){ const pts = [...pointers.values()]; pinchStartDistance = Math.hypot( pts[0].x - pts[1].x, pts[0].y - pts[1].y ); pinchStartZoom = zoom; dragging = false; } }, {passive:false} ); viewport.addEventListener( "pointermove", e => { if(!pointers.has(e.pointerId)){ return; } e.preventDefault(); pointers.set( e.pointerId, { x:e.clientX, y:e.clientY } ); if(pointers.size === 2){ const pts = [...pointers.values()]; const distance = Math.hypot( pts[0].x - pts[1].x, pts[0].y - pts[1].y ); if(pinchStartDistance > 0){ zoom = pinchStartZoom * (distance / pinchStartDistance); zoom = Math.max( 1, Math.min(6, zoom) ); updateImage(); } return; } if( pointers.size === 1 && dragging && zoom > 1 ){ posX = startPosX + (e.clientX - dragStartX); posY = startPosY + (e.clientY - dragStartY); updateImage(); } }, {passive:false} ); function pointerEnd(e){ pointers.delete(e.pointerId); if(pointers.size === 0){ dragging = false; pinchStartDistance = 0; } if(pointers.size === 1){ const pt = [...pointers.values()][0]; dragStartX = pt.x; dragStartY = pt.y; startPosX = posX; startPosY = posY; dragging = true; } } viewport.addEventListener( "pointerup", pointerEnd ); viewport.addEventListener( "pointercancel", pointerEnd ); /* ========================= 双击放大 ========================= */ viewport.addEventListener( "pointerup", e => { if(pointers.size > 0){ return; } const now = Date.now(); const dx = e.clientX - lastTapX; const dy = e.clientY - lastTapY; const distance = Math.hypot(dx,dy); if( now - lastTapTime < 300 && distance < 40 ){ if(zoom === 1){ zoom = 2.5; }else{ zoom = 1; posX = 0; posY = 0; } updateImage(); } lastTapTime = now; lastTapX = e.clientX; lastTapY = e.clientY; }, {passive:false} ); /* ========================= ESC ========================= */ document.addEventListener( "keydown", e => { if( e.key === "Escape" && lightbox.classList.contains("show") ){ closeLightbox(); } } ); /* ========================= 旋转手机 / 改变窗口大小 ========================= */ window.addEventListener( "resize", () => { if( !lightbox.classList.contains("show") || !lightboxImage.naturalWidth ){ return; } calculateBaseScale(); /* 手机横竖屏变化后， 回到完整显示状态， 保证不会出现裁切。 */ zoom = 1; posX = 0; posY = 0; updateImage(); } ); /* ========================= 首次加载 ========================= */ loadMore(); </script> </body> </html>
