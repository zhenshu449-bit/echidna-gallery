<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echidna Gallery</title><style>*{box-sizing:border-box}body{margin:0;background:#101016;color:#eee;font-family:system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:24px 16px}header{display:flex;justify-content:space-between;align-items:end;gap:18px;border-bottom:1px solid #292933;padding-bottom:20px}h1{margin:0;font-size:32px}p{margin:6px 0;color:#999}nav{display:flex;gap:8px;flex-wrap:wrap}button,input,select{background:#191920;border:1px solid #343440;color:#eee;border-radius:9px;padding:10px 13px}button.active{background:#7651a8}.toolbar{display:flex;gap:10px;margin:18px 0}input{flex:1}.grid{columns:4 230px;column-gap:14px}.card{break-inside:avoid;margin-bottom:14px;background:#18181f;border-radius:12px;overflow:hidden}.pic{position:relative;background:#25252d}.pic img{width:100%;display:block;min-height:220px;object-fit:cover}.badge{position:absolute;right:8px;top:8px;background:#8b2635;padding:5px 8px;border-radius:7px;font-size:12px}.safe{background:#333}.meta{padding:10px 12px}.meta small{display:block;color:#888;margin-top:4px}footer{text-align:center;color:#777;font-size:12px;padding:30px 0}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.grid{columns:2 150px}}</style></head><body><main><header><div><h1>♟ Echidna Gallery</h1><p>Re:Zero · 艾姬多娜同人图聚合站</p></div><nav><button class="active" onclick="filter('all',this)">全部</button><button onclick="filter('safe',this)">SFW</button><button onclick="filter('nsfw',this)">NSFW</button></nav></header><div class="toolbar"><input id="search" placeholder="搜索艾姬多娜、标签、作者…" oninput="render()"><select id="sort" onchange="render()"><option value="new">最新</option><option value="score">评分</option></select></div><div id="grid" class="grid"></div><footer>本站为作品索引示例；正式版将接入允许聚合的图片 API，并保留作者与原站链接。</footer></main><script>const data=[{title:'Echidna',type:'nsfw',score:982,url:'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=900'},{title:'Echidna / Re:Zero',type:'safe',score:921,url:'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=900'},{title:'Witch of Greed',type:'nsfw',score:875,url:'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=900'},{title:'Echidna',type:'safe',score:810,url:'https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=900'}];let current='all';function filter(x,b){current=x;document.querySelectorAll('nav button').forEach(v=>v.classList.remove('active'));b.classList.add('active');render()}function render(){let q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('sort').value,a=data.filter(x=>(current==='all'||x.type===current)&&x.title.toLowerCase().includes(q));if(s==='score')a.sort((x,y)=>y.score-x.score);document.getElementById('grid').innerHTML=a.map(x=>`<article class="card"><div class="pic"><img src="${x.url}" alt="${x.title}" loading="lazy"><span class="badge ${x.type==='safe'?'safe':''}">${x.type==='safe'?'SFW':'NSFW'}</span></div><div class="meta"><b>${x.title}</b><small>评分 ${x.score} · 来源待接入</small></div></article>`).join('')||'<p>没有找到结果。</p>'}render();</script></body></html>
