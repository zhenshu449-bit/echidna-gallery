<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"> <title>Echidna Gallery</title> <style> *{box-sizing:border-box} body{ margin:0; background:#111; color:#eee; font-family:Arial,sans-serif } body.no-scroll{ overflow:hidden } header{ padding:20px 12px; text-align:center; background:#181818; position:sticky; top:0; z-index:5 } h1{ margin:0 0 6px; font-size:26px } .sub{ color:#999; font-size:13px } .controls{ margin-top:15px } .row{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; margin-bottom:9px } button, input{ border:0; border-radius:8px; padding:9px 12px } button{ background:#333; color:#fff; cursor:pointer } button.active{ background:#8b5cf6 } button:disabled{ opacity:.5; cursor:not-allowed } input{ background:#292929; color:#fff; min-width:190px } main{ padding:16px; max-width:900px; margin:auto } .status{ text-align:center; color:#aaa; padding:15px } /* ========================= 一列图库 ========================= */ .grid{ display:grid; grid-template-columns:1fr; gap:16px } .card{ background:#1b1b1b; border-radius:10px; overflow:hidden } .card img{ display:block; width:100%; height:auto; background:#222; cursor:zoom-in } .info{ padding:10px; font-size:13px; color:#aaa } .badge{ display:inline-block; padding:3px 7px; border-radius:5px; margin-right:5px; color:#fff } .sfw{ background:#287a46 } .nsfw{ background:#9b3030 } a{ color:#aaa; text-decoration:none } .block-btn, .unblock-btn{ display:block; width:100%; margin-top:10px } .block-btn{ background:#572b2b } .unblock-btn{ background:#285c3b } .load-area{ text-align:center; padding:25px 10px } #loadMore{ padding:12px 25px; font-size:15px } /* ========================= 图片查看器 ========================= */ #lightbox{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.94); z-index:100; overflow:hidden; touch-action:none } #lightbox.show{ display:block } #lightboxViewport{ position:absolute; inset:0; overflow:hidden; touch-action:none } #lightboxImage{ position:absolute; left:50%; top:50%; max-width:none; width:auto; height:auto; transform-origin:center center; user-select:none; -webkit-user-select:none; -webkit-user-drag:none; touch-action:none; will-change:transform; } #closeLightbox{ position:absolute; top:12px; right:15px; width:46px; height:46px; padding:0; border-radius:50%; background:rgba(50,50,50,.85); color:#fff; font-size:30px; line-height:46px; z-index:102 } #zoomHint{ position:absolute; bottom:18px; left:50%; transform:translateX(-50%); padding:7px 12px; border-radius:8px; background:rgba(0,0,0,.6); color:#bbb; font-size:12px; z-index:102; pointer-events:none } </style> </head> <body> <header> <h1>☕ Echidna Gallery</h1> <div class="sub"> Re:Zero · Echidna Fan Gallery </div> <div class="controls"> <div class="row"> <button class="active" data-rating="all">全部</button> <button data-rating="safe">SFW</button> <button data-rating="nsfw">NSFW</button> </div> <div class="row"> <button class="active" data-tag="all">全部</button> <button data-tag="solo">单人</button> <button data-tag="multiple">多人</button> <button data-tag="swimsuit">泳装</button> <button data-tag="maid">女仆</button> <button data-tag="kimono">和服</button> <button data-tag="school_uniform">校服</button> <button data-tag="comic">漫画</button> <button data-tag="cosplay">Cosplay</button> </div> <div class="row"> <input id="search" placeholder="搜索标签 / Search tags" > <button id="reload"> 刷新 / Reload </button> <button id="showBlocked"> 🚫 已拉黑 / Blocked </button> <button id="clearBlocked"> 清空拉黑 / Clear </button> </div> </div> </header> <main> <div id="status" class="status"> 正在加载图片… </div> <div id="grid" class="grid"></div> <div class="load-area"> <button id="loadMore"> 加载更多 500 张 / Load 500 More </button> </div> </main> <!-- 图片查看器 --> <div id="lightbox"> <button id="closeLightbox"> × </button> <div id="lightboxViewport"> <img id="lightboxImage" alt="Echidna enlarged image" > </div> <div id="zoomHint"> 双指缩放 · 单指拖动 · 双击放大 </div> </div> <script> /* ========================= API ========================= */ const API= "https://danbooru.donmai.us/posts.json"; const TAG= "echidna_%28re:zero%29"; const PAGE_SIZE=100; const BATCH_PAGES=5; /* ========================= 拉黑 ========================= */ let blockedIds= JSON.parse( localStorage.getItem( "echidnaBlockedIds" )||"[]" ); let showingBlocked=false; /* ========================= 数据 ========================= */ let posts=[]; let page=1; let ratingFilter="all"; let tagFilter="all"; let loading=false; let finished=false; /* ========================= DOM ========================= */ const grid= document.getElementById("grid"); const status= document.getElementById("status"); const search= document.getElementById("search"); const loadMore= document.getElementById("loadMore"); const reload= document.getElementById("reload"); const showBlocked= document.getElementById("showBlocked"); const clearBlocked= document.getElementById("clearBlocked"); const lightbox= document.getElementById("lightbox"); const viewport= document.getElementById("lightboxViewport"); const lightboxImage= document.getElementById("lightboxImage"); const closeLightbox= document.getElementById("closeLightbox"); /* ========================= Rating ========================= */ function getRating(post){ return post.rating||"q"; } function isNSFW(post){ const rating= getRating(post); return( rating==="q"|| rating==="e" ); } /* ========================= 分类 ========================= */ const categoryTags={ solo:[ "solo" ], multiple:[ "multiple_girls", "multiple_boys", "multiple_person", "group" ], swimsuit:[ "swimsuit", "bikini" ], maid:[ "maid" ], kimono:[ "kimono", "yukata" ], school_uniform:[ "school_uniform", "serafuku", "seifuku" ], comic:[ "comic", "comic_page", "manga" ], cosplay:[ "cosplay" ] }; /* ========================= 标签筛选 ========================= */ function matchTag(post){ if(tagFilter==="all") return true; const tags= (post.tag_string||"") .toLowerCase() .split(" "); const wanted= categoryTags[tagFilter]||[]; return wanted.some( tag=>tags.includes(tag) ); } /* ========================= Rating筛选 ========================= */ function matchRating(post){ const rating= getRating(post); if(ratingFilter==="all") return true; if(ratingFilter==="safe"){ return( rating==="g"|| rating==="s" ); } if(ratingFilter==="nsfw"){ return( rating==="q"|| rating==="e" ); } return true; } /* ========================= 拉黑 ========================= */ function blockPost(id){ if( !blockedIds.includes(id) ){ blockedIds.push(id); localStorage.setItem( "echidnaBlockedIds", JSON.stringify(blockedIds) ); } render(); } /* ========================= 取消拉黑 ========================= */ function unblockPost(id){ blockedIds= blockedIds.filter( blockedId=>blockedId!==id ); localStorage.setItem( "echidnaBlockedIds", JSON.stringify(blockedIds) ); render(); } /* ========================= 图片查看器变量 ========================= */ let zoom=1; let posX=0; let posY=0; let baseScale=1; let imageNaturalWidth=0; let imageNaturalHeight=0; let pointers=new Map(); let pinchStartDistance=0; let pinchStartZoom=1; let pinchStartCenterX=0; let pinchStartCenterY=0; let pinchStartPosX=0; let pinchStartPosY=0; let dragStartX=0; let dragStartY=0; let dragStartPosX=0; let dragStartPosY=0; let moved=false; let lastTapTime=0; /* ========================= 计算图片初始大小 ========================= */ function calculateBaseScale(){ const vw= viewport.clientWidth; const vh= viewport.clientHeight; const padding=20; const availableWidth= vw-padding*2; const availableHeight= vh-padding*2; const scaleX= availableWidth/ imageNaturalWidth; const scaleY= availableHeight/ imageNaturalHeight; baseScale= Math.min( 1, scaleX, scaleY ); } /* ========================= 更新图片位置 ========================= */ function updateImage(){ lightboxImage.style.transform= `translate(-50%,-50%) translate(${posX}px,${posY}px) scale(${zoom})`; } /* ========================= 限制拖动范围 ========================= */ function clampPosition(){ const vw= viewport.clientWidth; const vh= viewport.clientHeight; const displayedWidth= imageNaturalWidth* baseScale* zoom; const displayedHeight= imageNaturalHeight* baseScale* zoom; const maxX= Math.max( 0, (displayedWidth-vw)/2 ); const maxY= Math.max( 0, (displayedHeight-vh)/2 ); posX= Math.max( -maxX, Math.min( maxX, posX ) ); posY= Math.max( -maxY, Math.min( maxY, posY ) ); } /* ========================= 重置缩放 ========================= */ function resetZoom(){ zoom=1; posX=0; posY=0; calculateBaseScale(); updateImage(); } /* ========================= 打开图片 ========================= */ function openLightbox(url){ lightboxImage.onload= function(){ imageNaturalWidth= lightboxImage.naturalWidth; imageNaturalHeight= lightboxImage.naturalHeight; resetZoom(); }; lightboxImage.src=url; lightbox.classList.add("show"); document.body.classList.add( "no-scroll" ); } /* ========================= 关闭图片 ========================= */ function closeLightboxFn(){ lightbox.classList.remove( "show" ); lightboxImage.src=""; pointers.clear(); document.body.classList.remove( "no-scroll" ); } /* ========================= 点击图库图片 ========================= */ grid.addEventListener( "click", function(event){ const img= event.target.closest( ".card img" ); if(!img) return; openLightbox( img.dataset.full||img.src ); } ); /* ========================= 关闭按钮 ========================= */ closeLightbox.addEventListener( "click", closeLightboxFn ); /* ========================= 背景关闭 ========================= */ viewport.addEventListener( "click", function(event){ if( !moved&& event.target===viewport ){ closeLightboxFn(); } } ); /* ========================= 双击放大 ========================= */ lightboxImage.addEventListener( "dblclick", function(event){ event.preventDefault(); if(zoom<2){ zoom=2; }else if(zoom<4){ zoom=4; }else{ zoom=1; posX=0; posY=0; } clampPosition(); updateImage(); } ); /* ========================= 指针按下 ========================= */ viewport.addEventListener( "pointerdown", function(event){ event.preventDefault(); viewport.setPointerCapture( event.pointerId ); pointers.set( event.pointerId, { x:event.clientX, y:event.clientY } ); moved=false; if(pointers.size===1){ dragStartX= event.clientX; dragStartY= event.clientY; dragStartPosX= posX; dragStartPosY= posY; const now= Date.now(); if( now-lastTapTime<300 ){ if(zoom<2){ zoom=2; }else if(zoom<4){ zoom=4; }else{ zoom=1; posX=0; posY=0; } clampPosition(); updateImage(); } lastTapTime=now; } if(pointers.size===2){ const pts= [...pointers.values()]; const dx= pts[0].x-pts[1].x; const dy= pts[0].y-pts[1].y; pinchStartDistance= Math.hypot(dx,dy); pinchStartZoom= zoom; pinchStartPosX= posX; pinchStartPosY= posY; pinchStartCenterX= (pts[0].x+pts[1].x)/2; pinchStartCenterY= (pts[0].y+pts[1].y)/2; } } ); /* ========================= 指针移动 ========================= */ viewport.addEventListener( "pointermove", function(event){ if( !pointers.has(event.pointerId) ) return; event.preventDefault(); pointers.set( event.pointerId, { x:event.clientX, y:event.clientY } ); if(pointers.size===1){ const dx= event.clientX- dragStartX; const dy= event.clientY- dragStartY; if( Math.abs(dx)>3|| Math.abs(dy)>3 ){ moved=true; } posX= dragStartPosX+dx; posY= dragStartPosY+dy; clampPosition(); updateImage(); } if(pointers.size===2){ const pts= [...pointers.values()]; const dx= pts[0].x-pts[1].x; const dy= pts[0].y-pts[1].y; const distance= Math.hypot(dx,dy); if(pinchStartDistance>0){ const ratio= distance/ pinchStartDistance; zoom= pinchStartZoom* ratio; zoom= Math.max( 1, Math.min( 6, zoom ) ); const centerX= (pts[0].x+pts[1].x)/2; const centerY= (pts[0].y+pts[1].y)/2; posX= pinchStartPosX+ centerX- pinchStartCenterX; posY= pinchStartPosY+ centerY- pinchStartCenterY; clampPosition(); updateImage(); moved=true; } } } ); /* ========================= 指针抬起 ========================= */ function pointerEnd(event){ pointers.delete( event.pointerId ); if(pointers.size<2){ pinchStartDistance=0; } } viewport.addEventListener( "pointerup", pointerEnd ); viewport.addEventListener( "pointercancel", pointerEnd ); /* ========================= 键盘 ESC ========================= */ document.addEventListener( "keydown", function(event){ if( event.key==="Escape"&& lightbox.classList.contains("show") ){ closeLightboxFn(); } } ); /* ========================= 加载图片 ========================= */ async function loadPage(){ if( loading|| finished ) return; loading=true; loadMore.disabled=true; status.textContent= "正在加载最多 500 张图片…"; try{ let loadedThisTime=0; let pagesLoaded=0; for( let i=0; i<BATCH_PAGES; i++ ){ const currentPage= page+i; const url= API+ "?limit="+ PAGE_SIZE+ "&page="+ currentPage+ "&tags="+ TAG; const response= await fetch(url); if(!response.ok){ throw new Error( "API Error "+ response.status ); } const newPosts= await response.json(); if( !Array.isArray(newPosts)|| newPosts.length===0 ){ finished=true; break; } const existingIds= new Set( posts.map( p=>p.id ) ); const unique= newPosts.filter( p=>!existingIds.has(p.id) ); posts.push(...unique); loadedThisTime+= unique.length; pagesLoaded++; if( newPosts.length< PAGE_SIZE ){ finished=true; break; } await new Promise( resolve=> setTimeout( resolve, 300 ) ); } page+=pagesLoaded; render(); if(finished){ loadMore.style.display= "none"; status.textContent= `已加载 ${posts.length} 张 · 已经没有更多图片了`; }else{ status.textContent= `已加载 ${posts.length} 张 · 本次新增 ${loadedThisTime} 张`; } }catch(error){ console.error(error); status.textContent= "加载失败，请稍后再试。"; }finally{ loading=false; loadMore.disabled=false; } } /* ========================= 渲染图库 ========================= */ function render(){ const keyword= search.value .trim() .toLowerCase(); const list= posts.filter( post=>{ const isBlocked= blockedIds.includes( post.id ); if(showingBlocked){ if(!isBlocked) return false; }else{ if(isBlocked) return false; } const ratingOK= matchRating(post); const tagOK= matchTag(post); const tags= (post.tag_string||"") .toLowerCase(); const searchOK= !keyword|| tags.includes(keyword); return( ratingOK&& tagOK&& searchOK ); } ); status.textContent= `已加载 ${posts.length} 张 · 当前显示 ${list.length} 张`; if(!list.length){ grid.innerHTML= '<div class="status">没有找到符合条件的图片</div>'; return; } grid.innerHTML= list.map( post=>{ const nsfw= isNSFW(post); const image= post.large_file_url|| post.file_url|| post.preview_file_url; const source= post.source||""; const isBlocked= blockedIds.includes( post.id ); return ` <article class="card"> <img src="${image}" data-full="${image}" loading="lazy" alt="Echidna" > <div class="info"> <span class="badge ${nsfw?"nsfw":"sfw"}"> ${nsfw?"NSFW":"SFW"} </span> ⭐ ${post.score??0} <br><br> <a href="https://danbooru.donmai.us/posts/${post.id}" target="_blank" rel="noopener" > 查看原帖 / Original Post </a> ${source?` <br><br> <a href="${source}" target="_blank" rel="noopener" > 原始来源 / Source </a> `:""} <button class="${ isBlocked ?"unblock-btn" :"block-btn" }" onclick="${ isBlocked ?`unblockPost(${post.id})` :`blockPost(${post.id})` }" > ${ isBlocked ?"↩️ 取消拉黑 / Unblock" :"🚫 拉黑 / Block" } </button> </div> </article> `; } ).join(""); } /* ========================= Rating按钮 ========================= */ document .querySelectorAll( "[data-rating]" ) .forEach( button=>{ button.addEventListener( "click", ()=>{ document .querySelectorAll( "[data-rating]" ) .forEach( b=> b.classList.remove( "active" ) ); button.classList.add( "active" ); ratingFilter= button.dataset.rating; render(); } ); } ); /* ========================= 分类按钮 ========================= */ document .querySelectorAll( "[data-tag]" ) .forEach( button=>{ button.addEventListener( "click", ()=>{ document .querySelectorAll( "[data-tag]" ) .forEach( b=> b.classList.remove( "active" ) ); button.classList.add( "active" ); tagFilter= button.dataset.tag; render(); } ); } ); /* ========================= 搜索 ========================= */ search.addEventListener( "input", render ); /* ========================= 加载更多 ========================= */ loadMore.addEventListener( "click", loadPage ); /* ========================= 刷新 ========================= */ reload.addEventListener( "click", ()=>{ posts=[]; page=1; finished=false; showingBlocked=false; showBlocked.classList.remove( "active" ); showBlocked.textContent= "🚫 已拉黑 / Blocked"; loadMore.style.display= "inline-block"; grid.innerHTML=""; loadPage(); } ); /* ========================= 查看拉黑 ========================= */ showBlocked.addEventListener( "click", ()=>{ showingBlocked= !showingBlocked; showBlocked.classList.toggle( "active", showingBlocked ); showBlocked.textContent= showingBlocked ?"↩️ 返回图库 / Gallery" :"🚫 已拉黑 / Blocked"; render(); } ); /* ========================= 清空拉黑 ========================= */ clearBlocked.addEventListener( "click", ()=>{ if(!blockedIds.length){ alert( "目前没有拉黑任何图片。" ); return; } const ok= confirm( `确定要清空全部 ${blockedIds.length} 张拉黑图片吗？` ); if(!ok) return; blockedIds=[]; localStorage.removeItem( "echidnaBlockedIds" ); showingBlocked=false; showBlocked.classList.remove( "active" ); showBlocked.textContent= "🚫 已拉黑 / Blocked"; render(); } ); /* ========================= 开始加载 ========================= */ loadPage(); </script> </body> </html>
