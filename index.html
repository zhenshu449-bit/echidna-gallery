<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Echidna Gallery</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111;
  color:#eee;
  font-family:Arial,sans-serif;
}

header{
  padding:20px 12px;
  text-align:center;
  background:#181818;
  position:sticky;
  top:0;
  z-index:5;
}

h1{
  margin:0 0 6px;
  font-size:26px;
}

.sub{
  color:#999;
  font-size:13px;
}

.controls{
  margin-top:15px;
}

.main-filter,
.tag-filter{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:9px;
}

button,input{
  border:0;
  border-radius:8px;
  padding:9px 12px;
}

button{
  background:#333;
  color:#fff;
  cursor:pointer;
}

button.active{
  background:#8b5cf6;
}

button:disabled{
  opacity:.5;
}

input{
  background:#292929;
  color:#fff;
  min-width:190px;
}

main{
  padding:16px;
  max-width:1200px;
  margin:auto;
}

.status{
  text-align:center;
  color:#aaa;
  padding:15px;
}

.grid{
  columns:2 180px;
  column-gap:12px;
}

.card{
  break-inside:avoid;
  margin-bottom:12px;
  background:#1b1b1b;
  border-radius:10px;
  overflow:hidden;
}

.card img{
  display:block;
  width:100%;
  height:auto;
  background:#222;
}

.info{
  padding:9px;
  font-size:12px;
  color:#aaa;
}

.badge{
  display:inline-block;
  padding:3px 7px;
  border-radius:5px;
  margin-right:5px;
  color:#fff;
}

.sfw{
  background:#287a46;
}

.nsfw{
  background:#9b3030;
}

a{
  color:#aaa;
  text-decoration:none;
}

.load-area{
  text-align:center;
  padding:25px 10px;
}

#loadMore{
  padding:12px 25px;
  font-size:15px;
}

@media(min-width:700px){
  .grid{
    columns:4 180px;
  }
}
</style>
</head>

<body>

<header>

<h1>☕ Echidna Gallery</h1>

<div class="sub">
Re:Zero · Echidna Fan Gallery
</div>

<!-- 第一层：SFW / NSFW -->

<div class="controls">

<div class="main-filter">

<button class="active" data-rating="all">
全部
</button>

<button data-rating="safe">
SFW
</button>

<button data-rating="nsfw">
NSFW
</button>

</div>


<!-- 第二层：标签分类 -->

<div class="tag-filter">

<button class="active" data-tag="all">
全部
</button>

<button data-tag="solo">
单人
</button>

<button data-tag="multiple">
多人
</button>

<button data-tag="swimsuit">
泳装
</button>

<button data-tag="maid">
女仆
</button>

<button data-tag="kimono">
和服
</button>

<button data-tag="school_uniform">
校服
</button>

<button data-tag="comic">
漫画
</button>

<button data-tag="cosplay">
Cosplay
</button>

</div>


<div class="main-filter">

<input
id="search"
placeholder="搜索标签 / Search tags"
>

<button id="reload">
刷新 / Reload
</button>

</div>

</div>

</header>


<main>

<div id="status" class="status">
正在加载图片…
</div>

<div id="grid" class="grid"></div>

<div class="load-area">
<button id="loadMore">
加载更多 / Load More
</button>
</div>

</main>


<script>

const API="https://danbooru.donmai.us/posts.json";

const TAG="echidna_%28re:zero%29";

const LIMIT=300;

let posts=[];

let page=1;

let ratingFilter="all";

let tagFilter="all";

let loading=false;

let finished=false;


const grid=document.getElementById("grid");

const status=document.getElementById("status");

const search=document.getElementById("search");

const loadMore=document.getElementById("loadMore");

const reload=document.getElementById("reload");


function getRating(post){

  return post.rating||"q";

}


function isNSFW(post){

  const rating=getRating(post);

  return rating==="q"||rating==="e";

}


/* 分类标签 */

const categoryTags={

  solo:[
    "solo"
  ],

  multiple:[
    "multiple_girls",
    "multiple_boys",
    "multiple_person",
    "group"
  ],

  swimsuit:[
    "swimsuit",
    "bikini"
  ],

  maid:[
    "maid"
  ],

  kimono:[
    "kimono",
    "yukata"
  ],

  school_uniform:[
    "school_uniform",
    "serafuku",
    "seifuku"
  ],

  comic:[
    "comic",
    "comic_page",
    "manga"
  ],

  cosplay:[
    "cosplay"
  ]

};


function matchTag(post){

  if(tagFilter==="all"){
    return true;
  }

  const tags=
    (post.tag_string||"")
    .toLowerCase()
    .split(" ");

  const wanted=
    categoryTags[tagFilter]||[];

  return wanted.some(tag=>{
    return tags.includes(tag);
  });

}


function matchRating(post){

  const rating=getRating(post);

  if(ratingFilter==="all"){
    return true;
  }

  if(ratingFilter==="safe"){
    return rating==="g"||rating==="s";
  }

  if(ratingFilter==="nsfw"){
    return rating==="q"||rating==="e";
  }

  return true;

}


async function loadPage(){

  if(loading||finished){
    return;
  }

  loading=true;

  loadMore.disabled=true;

  status.textContent=
    `正在加载第 ${page} 页…`;

  try{

    const url=
      API+
      "?limit="+LIMIT+
      "&page="+page+
      "&tags="+TAG;

    const response=
      await fetch(url);

    if(!response.ok){
      throw new Error(
        "API Error "+response.status
      );
    }

    const newPosts=
      await response.json();

    if(
      !Array.isArray(newPosts)||
      newPosts.length===0
    ){

      finished=true;

      status.textContent=
        "已经没有更多图片了";

      loadMore.style.display="none";

      return;

    }


    const existingIds=
      new Set(posts.map(p=>p.id));


    const unique=
      newPosts.filter(
        p=>!existingIds.has(p.id)
      );


    posts.push(...unique);

    page++;

    render();


    if(newPosts.length<LIMIT){

      finished=true;

      loadMore.style.display="none";

    }

  }catch(error){

    console.error(error);

    status.textContent=
      "加载失败，请稍后再试。";

  }finally{

    loading=false;

    loadMore.disabled=false;

  }

}


function render(){

  const keyword=
    search.value.trim().toLowerCase();


  const list=
    posts.filter(post=>{

      const ratingOK=
        matchRating(post);

      const tagOK=
        matchTag(post);

      const tags=
        (post.tag_string||"")
        .toLowerCase();

      const searchOK=
        !keyword||
        tags.includes(keyword);

      return ratingOK&&tagOK&&searchOK;

    });


  status.textContent=
    `已加载 ${posts.length} 张 · 当前显示 ${list.length} 张`;


  if(!list.length){

    grid.innerHTML=
      '<div class="status">没有找到符合条件的图片</div>';

    return;

  }


  grid.innerHTML=
    list.map(post=>{

      const nsfw=
        isNSFW(post);

      const image=
        post.large_file_url||
        post.file_url||
        post.preview_file_url;

      const source=
        post.source||"";


      return `

      <article class="card">

        <a
          href="https://danbooru.donmai.us/posts/${post.id}"
          target="_blank"
          rel="noopener"
        >

          <img
            src="${image}"
            loading="lazy"
            alt="Echidna"
          >

        </a>


        <div class="info">

          <span class="badge ${nsfw?"nsfw":"sfw"}">
            ${nsfw?"NSFW":"SFW"}
          </span>

          ⭐ ${post.score??0}

          <br><br>


          <a
            href="https://danbooru.donmai.us/posts/${post.id}"
            target="_blank"
            rel="noopener"
          >
            查看原帖 / Original Post
          </a>


          ${
            source
            ?
            `<br><br>
            <a
              href="${source}"
              target="_blank"
              rel="noopener"
            >
              原始来源 / Source
            </a>`
            :
            ""
          }

        </div>

      </article>

      `;

    }).join("");

}


/* 第一层按钮 */

document
.querySelectorAll("[data-rating]")
.forEach(button=>{

  button.addEventListener("click",()=>{

    document
    .querySelectorAll("[data-rating]")
    .forEach(b=>{
      b.classList.remove("active");
    });

    button.classList.add("active");

    ratingFilter=
      button.dataset.rating;

    render();

  });

});


/* 第二层按钮 */

document
.querySelectorAll("[data-tag]")
.forEach(button=>{

  button.addEventListener("click",()=>{

    document
    .querySelectorAll("[data-tag]")
    .forEach(b=>{
      b.classList.remove("active");
    });

    button.classList.add("active");

    tagFilter=
      button.dataset.tag;

    render();

  });

});


search.addEventListener(
  "input",
  render
);


loadMore.addEventListener(
  "click",
  loadPage
);


reload.addEventListener("click",()=>{

  posts=[];

  page=1;

  finished=false;

  loadMore.style.display=
    "inline-block";

  grid.innerHTML="";

  loadPage();

});


loadPage();

</script>
