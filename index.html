<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <title>Echidna Gallery</title> <style> *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; } html,body{ margin:0; padding:0; width:100%; min-height:100%; background:#f5f5f5; color:#222; font-family:Arial,"Microsoft YaHei",sans-serif; } body.no-scroll{ overflow:hidden; } header{ position:sticky; top:0; z-index:50; background:rgba(255,255,255,.96); backdrop-filter:blur(10px); border-bottom:1px solid #ddd; padding:12px; } header h1{ margin:0 0 10px; text-align:center; font-size:22px; } .controls{ width:100%; max-width:900px; margin:auto; } .row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; } button, input{ min-height:38px; padding:8px 11px; border:1px solid #ccc; border-radius:8px; background:#fff; font-size:14px; } button{ cursor:pointer; } button:disabled{ cursor:not-allowed; opacity:.6; } button.active{ background:#222; color:#fff; } input{ flex:1 1 180px; min-width:0; outline:none; } main{ width:100%; max-width:900px; margin:auto; padding:10px; } .grid{ width:100%; display:grid; grid-template-columns:1fr; gap:12px; } .card{ width:100%; overflow:hidden; background:#fff; border:1px solid #ddd; border-radius:9px; } .card img{ display:block; width:100%; max-width:100%; height:auto; object-fit:contain; cursor:zoom-in; background:#eee; } .info{ padding:8px; font-size:13px; line-height:1.5; } .links{ display:flex; flex-wrap:wrap; gap:8px; margin-top:3px; } .links a{ color:#1677ff; text-decoration:none; } .favoriteBtn{ color:#e09a00 !important; } .blockBtn{ color:#1677ff !important; } #status{ text-align:center; color:#777; padding:5px 0 12px; font-size:13px; } #loadMore{ display:block; width:100%; margin:15px 0; padding:12px; } #viewer{ position:fixed; inset:0; z-index:99999; display:none; width:100vw; height:100dvh; background:#000; overflow:hidden; touch-action:none; overscroll-behavior:none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); } #viewer.open{ display:block; } #viewerStage{ position:absolute; left:0; top:0; width:100%; height:100%; overflow:hidden; touch-action:none; } #viewerImage{ position:absolute; left:50%; top:50%; display:block; width:auto; height:auto; max-width:none; max-height:none; margin:0; padding:0; transform-origin:center center; user-select:none; -webkit-user-select:none; -webkit-user-drag:none; touch-action:none; will-change:transform; } #viewerClose{ position:absolute; z-index:10; top:calc(10px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right)); width:42px; height:42px; padding:0; border:0; border-radius:50%; background:rgba(255,255,255,.2); color:#fff; font-size:28px; line-height:42px; } #viewerHint{ position:absolute; z-index:10; left:50%; bottom:calc(10px + env(safe-area-inset-bottom)); transform:translateX(-50%); padding:6px 11px; border-radius:20px; background:rgba(0,0,0,.55); color:rgba(255,255,255,.8); font-size:12px; white-space:nowrap; pointer-events:none; } @media(max-width:600px){ header{ padding:9px 7px; } header h1{ font-size:20px; margin-bottom:8px; } button, input{ font-size:13px; min-height:36px; padding:7px 9px; } main{ padding:7px; } .grid{ gap:9px; } .card{ border-radius:7px; } .info{ padding:7px; } } </style> </head> <body> <header> <h1>🌿 Echidna Gallery</h1> <div class="controls"> <!-- 第一行 --> <div class="row"> <button class="rating active" data-rating="all"> 全部 </button> <button class="rating" data-rating="safe"> SFW </button> <button class="rating" data-rating="nsfw"> NSFW </button> <button id="favoriteBtn"> ⭐ 我的收藏 </button> <button id="blockedBtn"> 🚫 已拉黑 </button> <button id="clearFavorites"> 清空收藏 </button> <button id="clearBlocked"> 清空拉黑 </button> </div> <!-- 分类 --> <div class="row"> <button class="category active" data-cat="all"> 全部 </button> <button class="category" data-cat="solo"> 单人 </button> <button class="category" data-cat="multiple"> 多人 </button> <button class="category" data-cat="swimsuit"> 泳装 </button> <button class="category" data-cat="maid"> 女仆 </button> <button class="category" data-cat="kimono"> 和服 </button> <button class="category" data-cat="school"> 校服 </button> <button class="category" data-cat="comic"> 漫画 </button> <button class="category" data-cat="cosplay"> Cosplay </button> </div> <!-- 搜索 --> <div class="row"> <input id="tagSearch" placeholder="输入标签，例如 swimsuit" > <button id="searchBtn"> 搜索 </button> <button id="resetBtn"> 重置 </button> </div> </div> </header> <main> <div id="status"> 准备加载… </div> <div id="grid" class="grid"> </div> <button id="loadMore"> 加载更多 </button> </main> <!-- 大图查看器 --> <div id="viewer"> <button id="viewerClose"> × </button> <div id="viewerStage"> <img id="viewerImage" draggable="false" > </div> <div id="viewerHint"> 双指缩放 · 单指拖动 · 双击放大 </div> </div> <script> /* ========================================================= Danbooru ========================================================= */ const API = "https://danbooru.donmai.us/posts.json"; const MAIN_TAG = "echidna_%28re:zero%29"; /* * 每页 100 张 * 每次加载 2 页 * = 200 张 */ const PER_PAGE = 100; const PAGES_PER_CLICK = 2; /* ========================================================= 状态 ========================================================= */ let page = 1; let posts = []; let ratingFilter = "all"; let categoryFilter = "all"; let searchTag = ""; let showBlocked = false; let showFavorites = false; let isLoading = false; /* ========================================================= 拉黑 ========================================================= */ const blockedKey = "echidnaBlockedIds"; let blockedIds = []; try{ const saved = JSON.parse( localStorage.getItem(blockedKey) || "[]" ); if(Array.isArray(saved)){ blockedIds = saved.map(id => String(id)); } }catch(error){ console.warn( "读取拉黑数据失败：", error ); blockedIds = []; } blockedIds = [...new Set(blockedIds)]; /* ========================================================= 收藏 ========================================================= */ const favoriteKey = "echidnaFavoriteIds"; let favoriteIds = []; try{ const saved = JSON.parse( localStorage.getItem(favoriteKey) || "[]" ); if(Array.isArray(saved)){ favoriteIds = saved.map(id => String(id)); } }catch(error){ console.warn( "读取收藏数据失败：", error ); favoriteIds = []; } favoriteIds = [...new Set(favoriteIds)]; /* ========================================================= 基础 ========================================================= */ const grid = document.getElementById("grid"); const status = document.getElementById("status"); const loadBtn = document.getElementById("loadMore"); const favoriteBtn = document.getElementById("favoriteBtn"); const blockedBtn = document.getElementById("blockedBtn"); /* ========================================================= 保存拉黑 ========================================================= */ function saveBlocked(){ blockedIds = [ ...new Set( blockedIds.map( id => String(id) ) ) ]; localStorage.setItem( blockedKey, JSON.stringify(blockedIds) ); } /* ========================================================= 判断拉黑 ========================================================= */ function isBlocked(id){ const targetId = String(id); return blockedIds.some( blockedId => String(blockedId) === targetId ); } /* ========================================================= 保存收藏 ========================================================= */ function saveFavorites(){ favoriteIds = [ ...new Set( favoriteIds.map( id => String(id) ) ) ]; localStorage.setItem( favoriteKey, JSON.stringify(favoriteIds) ); } /* ========================================================= 判断收藏 ========================================================= */ function isFavorite(id){ const targetId = String(id); return favoriteIds.some( favoriteId => String(favoriteId) === targetId ); } /* ========================================================= Rating ========================================================= */ function getRating(post){ if( post.rating === "s" || post.rating === "g" ){ return "safe"; } return "nsfw"; } /* ========================================================= 标签 ========================================================= */ function getTags(post){ return " " + (post.tag_string || "") + " "; } /* ========================================================= 分类 ========================================================= */ function matchCategory(post){ if( categoryFilter === "all" ){ return true; } const tags = getTags(post); if( categoryFilter === "solo" ){ return tags.includes( " solo " ); } if( categoryFilter === "multiple" ){ return ( tags.includes( " multiple_girls " ) || tags.includes( " multiple_boys " ) || tags.includes( " multiple_person " ) || tags.includes( " group " ) ); } if( categoryFilter === "swimsuit" ){ return ( tags.includes( " swimsuit " ) || tags.includes( " bikini " ) ); } if( categoryFilter === "maid" ){ return tags.includes( " maid " ); } if( categoryFilter === "kimono" ){ return ( tags.includes( " kimono " ) || tags.includes( " yukata " ) ); } if( categoryFilter === "school" ){ return ( tags.includes( " school_uniform " ) || tags.includes( " serafuku " ) || tags.includes( " seifuku " ) ); } if( categoryFilter === "comic" ){ return ( tags.includes( " comic " ) || tags.includes( " comic_page " ) || tags.includes( " manga " ) ); } if( categoryFilter === "cosplay" ){ return tags.includes( " cosplay " ); } return true; } /* ========================================================= 显示判断 ========================================================= */ function shouldShow(post){ /* * 收藏页面 */ if(showFavorites){ if( !isFavorite(post.id) ){ return false; } } /* * 拉黑页面 */ if(showBlocked){ if( !isBlocked(post.id) ){ return false; } }else{ /* * 普通页面隐藏拉黑 */ if( isBlocked(post.id) ){ return false; } } /* * Rating */ if( ratingFilter !== "all" && getRating(post) !== ratingFilter ){ return false; } /* * 分类 */ if( !matchCategory(post) ){ return false; } /* * 标签搜索 */ if(searchTag){ const tags = (post.tag_string || "") .toLowerCase(); if( !tags.includes( searchTag.toLowerCase() ) ){ return false; } } return true; } /* ========================================================= 渲染 ========================================================= */ function render(){ grid.innerHTML = ""; const visible = posts.filter( shouldShow ); visible.forEach(post => { const card = document.createElement("div"); card.className = "card"; /* * 图片 */ const img = document.createElement("img"); const imageUrl = post.large_file_url || post.file_url || post.preview_file_url; img.src = imageUrl; img.loading = "lazy"; img.dataset.full = imageUrl; img.dataset.id = String(post.id); card.appendChild(img); /* * 信息 */ const info = document.createElement("div"); info.className = "info"; const rating = getRating(post) === "safe" ? "SFW" : "NSFW"; const favoriteText = isFavorite(post.id) ? "⭐ 已收藏" : "☆ 收藏"; info.innerHTML = ` <div> ID: ${post.id} </div> <div> Rating: ${rating} </div> <div class="links"> <a href="https://danbooru.donmai.us/posts/${post.id}" target="_blank" rel="noopener" > Original Post </a> ${ post.source ? ` <a href="${post.source}" target="_blank" rel="noopener" > Source </a> ` : "" } <a href="#" class="favoriteBtn" data-id="${post.id}" > ${favoriteText} </a> <a href="#" class="blockBtn" data-id="${post.id}" > 🚫 拉黑 </a> </div> `; card.appendChild(info); grid.appendChild(card); }); /* * 状态文字 */ if(showFavorites){ status.textContent = `⭐ 收藏 ${visible.length} 张`; }else if(showBlocked){ status.textContent = `🚫 已拉黑 ${visible.length} 张`; }else{ status.textContent = `显示 ${visible.length} 张 · 已加载 ${posts.length} 张`; } /* * 按钮文字 */ favoriteBtn.textContent = showFavorites ? "返回图库" : "⭐ 我的收藏"; blockedBtn.textContent = showBlocked ? "返回图库" : "🚫 已拉黑"; /* * 收藏/拉黑页面时， * 不需要继续加载更多 */ if( showFavorites || showBlocked ){ loadBtn.style.display = "none"; }else{ loadBtn.style.display = "block"; } } /* ========================================================= 图片 / 收藏 / 拉黑点击 ========================================================= */ grid.addEventListener( "click", e => { /* * 收藏 */ const favBtn = e.target.closest( ".favoriteBtn" ); if(favBtn){ e.preventDefault(); const id = String( favBtn.dataset.id ); if( isFavorite(id) ){ /* * 取消收藏 */ favoriteIds = favoriteIds.filter( favoriteId => String(favoriteId) !== id ); }else{ /* * 添加收藏 */ favoriteIds.push(id); } saveFavorites(); render(); return; } /* * 拉黑 */ const blockBtn = e.target.closest( ".blockBtn" ); if(blockBtn){ e.preventDefault(); const id = String( blockBtn.dataset.id ); if( !isBlocked(id) ){ blockedIds.push(id); } saveBlocked(); render(); return; } /* * 图片 */ const img = e.target.closest( ".card img" ); if(img){ openViewer( img.dataset.full ); } } ); /* ========================================================= 收藏页 ========================================================= */ favoriteBtn.addEventListener( "click", () => { /* * 如果当前正在拉黑页， * 先退出拉黑页 */ if(showBlocked){ showBlocked = false; } showFavorites = !showFavorites; render(); } ); /* ========================================================= 拉黑页 ========================================================= */ blockedBtn.addEventListener( "click", () => { /* * 如果当前正在收藏页， * 先退出收藏页 */ if(showFavorites){ showFavorites = false; } showBlocked = !showBlocked; render(); } ); /* ========================================================= 清空收藏 ========================================================= */ document .getElementById("clearFavorites") .addEventListener( "click", () => { if( favoriteIds.length === 0 ){ return; } favoriteIds = []; saveFavorites(); showFavorites = false; render(); } ); /* ========================================================= 清空拉黑 ========================================================= */ document .getElementById("clearBlocked") .addEventListener( "click", () => { if( blockedIds.length === 0 ){ return; } blockedIds = []; saveBlocked(); showBlocked = false; render(); } ); /* ========================================================= Rating ========================================================= */ document .querySelectorAll(".rating") .forEach(btn => { btn.addEventListener( "click", () => { document .querySelectorAll(".rating") .forEach(b => b.classList.remove( "active" ) ); btn.classList.add( "active" ); ratingFilter = btn.dataset.rating; render(); } ); }); /* ========================================================= 分类 ========================================================= */ document .querySelectorAll(".category") .forEach(btn => { btn.addEventListener( "click", () => { document .querySelectorAll(".category") .forEach(b => b.classList.remove( "active" ) ); btn.classList.add( "active" ); categoryFilter = btn.dataset.cat; render(); } ); }); /* ========================================================= 搜索 ========================================================= */ document .getElementById("searchBtn") .addEventListener( "click", () => { searchTag = document .getElementById("tagSearch") .value .trim(); render(); } ); /* ========================================================= 重置搜索 ========================================================= */ document .getElementById("resetBtn") .addEventListener( "click", () => { searchTag = ""; document .getElementById("tagSearch") .value = ""; render(); } ); /* ========================================================= 加载 Danbooru ========================================================= */ async function loadMore(){ if(isLoading){ return; } isLoading = true; loadBtn.disabled = true; loadBtn.textContent = "正在加载…"; status.textContent = "正在加载…"; const startPage = page; let newPosts = []; try{ /* * 每次 2 页 * 100 + 100 = 200 */ for( let p = startPage; p < startPage + PAGES_PER_CLICK; p++ ){ const url = `${API}?tags=${MAIN_TAG}&limit=${PER_PAGE}&page=${p}`; const response = await fetch( url, { method:"GET", cache:"no-store" } ); if( !response.ok ){ throw new Error( `API error: ${response.status}` ); } const data = await response.json(); if( !Array.isArray(data) ){ throw new Error( "API 返回数据格式错误" ); } newPosts.push( ...data ); if( data.length < PER_PAGE ){ page = p + 1; break; } page = p + 1; } /* * 去重 * * 收藏和拉黑的数据 * 都不会从 posts 删除。 */ const map = new Map(); [ ...posts, ...newPosts ].forEach(post => { const id = String(post.id); map.set( id, { ...post, id:id } ); }); posts = [...map.values()]; render(); loadBtn.disabled = false; loadBtn.textContent = "加载更多"; if( newPosts.length === 0 ){ loadBtn.textContent = "没有更多了"; loadBtn.disabled = true; } }catch(error){ console.error( error ); status.textContent = "加载失败，请稍后重试"; loadBtn.disabled = false; loadBtn.textContent = "重新加载"; }finally{ isLoading = false; } } loadBtn.addEventListener( "click", loadMore ); /* ========================================================= 大图查看器 ========================================================= */ const viewer = document.getElementById( "viewer" ); const viewerStage = document.getElementById( "viewerStage" ); const viewerImage = document.getElementById( "viewerImage" ); const viewerClose = document.getElementById( "viewerClose" ); let fitScale = 1; let scale = 1; let translateX = 0; let translateY = 0; const pointers = new Map(); let pinchStartDistance = 0; let pinchStartScale = 1; let dragStartX = 0; let dragStartY = 0; let dragStartTranslateX = 0; let dragStartTranslateY = 0; let lastTapTime = 0; let lastTapX = 0; let lastTapY = 0; /* ========================================================= 完整显示 ========================================================= */ function calculateFitScale(){ const screenWidth = viewerStage.clientWidth; const screenHeight = viewerStage.clientHeight; const imageWidth = viewerImage.naturalWidth; const imageHeight = viewerImage.naturalHeight; if( !imageWidth || !imageHeight ){ return 1; } const widthScale = screenWidth / imageWidth; const heightScale = screenHeight / imageHeight; fitScale = Math.min( widthScale, heightScale ); fitScale = Math.min( fitScale, 1 ); return fitScale; } /* ========================================================= 更新查看器 ========================================================= */ function updateViewerImage(){ const finalScale = fitScale * scale; viewerImage.style.transform = ` translate(-50%, -50%) translate( ${translateX}px, ${translateY}px ) scale(${finalScale}) `; } /* ========================================================= 打开查看器 ========================================================= */ function openViewer(url){ viewer.classList.add( "open" ); document.body.classList.add( "no-scroll" ); scale = 1; translateX = 0; translateY = 0; viewerImage.onload = () => { calculateFitScale(); scale = 1; translateX = 0; translateY = 0; updateViewerImage(); }; viewerImage.src = url; } /* ========================================================= 关闭查看器 ========================================================= */ function closeViewer(){ viewer.classList.remove( "open" ); document.body.classList.remove( "no-scroll" ); pointers.clear(); viewerImage.src = ""; } viewerClose.addEventListener( "click", closeViewer ); /* ========================================================= 黑色区域关闭 ========================================================= */ viewer.addEventListener( "click", e => { if( e.target === viewer || e.target === viewerStage ){ closeViewer(); } } ); /* ========================================================= 限制拖动 ========================================================= */ function clampPosition(){ const finalScale = fitScale * scale; const imageWidth = viewerImage.naturalWidth * finalScale; const imageHeight = viewerImage.naturalHeight * finalScale; const screenWidth = viewerStage.clientWidth; const screenHeight = viewerStage.clientHeight; const maxX = Math.max( 0, (imageWidth - screenWidth) / 2 ); const maxY = Math.max( 0, (imageHeight - screenHeight) / 2 ); translateX = Math.max( -maxX, Math.min( maxX, translateX ) ); translateY = Math.max( -maxY, Math.min( maxY, translateY ) ); } /* ========================================================= Pointer Down ========================================================= */ viewerStage.addEventListener( "pointerdown", e => { e.preventDefault(); pointers.set( e.pointerId, { x:e.clientX, y:e.clientY } ); try{ viewerStage.setPointerCapture( e.pointerId ); }catch(error){} if( pointers.size === 1 ){ dragStartX = e.clientX; dragStartY = e.clientY; dragStartTranslateX = translateX; dragStartTranslateY = translateY; } if( pointers.size === 2 ){ const p = [...pointers.values()]; pinchStartDistance = Math.hypot( p[0].x - p[1].x, p[0].y - p[1].y ); pinchStartScale = scale; } }, { passive:false } ); /* ========================================================= Pointer Move ========================================================= */ viewerStage.addEventListener( "pointermove", e => { if( !pointers.has( e.pointerId ) ){ return; } e.preventDefault(); pointers.set( e.pointerId, { x:e.clientX, y:e.clientY } ); if( pointers.size === 2 ){ const p = [...pointers.values()]; const distance = Math.hypot( p[0].x - p[1].x, p[0].y - p[1].y ); if( pinchStartDistance > 0 ){ scale = pinchStartScale * ( distance / pinchStartDistance ); scale = Math.max( 1, Math.min( 6, scale ) ); clampPosition(); updateViewerImage(); } return; } if( pointers.size === 1 && scale > 1 ){ translateX = dragStartTranslateX + ( e.clientX - dragStartX ); translateY = dragStartTranslateY + ( e.clientY - dragStartY ); clampPosition(); updateViewerImage(); } }, { passive:false } ); /* ========================================================= Pointer Up ========================================================= */ function pointerUp(e){ pointers.delete( e.pointerId ); } viewerStage.addEventListener( "pointerup", pointerUp ); viewerStage.addEventListener( "pointercancel", pointerUp ); /* ========================================================= 双击 ========================================================= */ viewerStage.addEventListener( "pointerup", e => { if( pointers.size !== 0 ){ return; } const now = Date.now(); const dx = e.clientX - lastTapX; const dy = e.clientY - lastTapY; const distance = Math.hypot( dx, dy ); if( now - lastTapTime < 300 && distance < 40 ){ if( scale === 1 ){ scale = 2.5; }else{ scale = 1; translateX = 0; translateY = 0; } clampPosition(); updateViewerImage(); } lastTapTime = now; lastTapX = e.clientX; lastTapY = e.clientY; }, { passive:false } ); /* ========================================================= 手机旋转 ========================================================= */ window.addEventListener( "resize", () => { if( !viewer.classList.contains( "open" ) ){ return; } calculateFitScale(); scale = 1; translateX = 0; translateY = 0; updateViewerImage(); } ); /* ========================================================= ESC ========================================================= */ document.addEventListener( "keydown", e => { if( e.key === "Escape" && viewer.classList.contains( "open" ) ){ closeViewer(); } } ); /* ========================================================= 开始 ========================================================= */ loadMore(); </script> </body> </html>
