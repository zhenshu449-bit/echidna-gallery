<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <title>Echidna Gallery</title> <style> *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; } html,body{ margin:0; padding:0; width:100%; min-height:100%; background:#f5f5f5; color:#222; font-family:Arial,"Microsoft YaHei",sans-serif; } body.no-scroll{ overflow:hidden; } /* ========================= 顶部 ========================= */ header{ position:sticky; top:0; z-index:50; background:rgba(255,255,255,.96); backdrop-filter:blur(10px); border-bottom:1px solid #ddd; padding:12px; } header h1{ margin:0 0 10px; text-align:center; font-size:22px; } .controls{ width:100%; max-width:900px; margin:auto; } .row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; } button, input{ min-height:38px; padding:8px 11px; border:1px solid #ccc; border-radius:8px; background:#fff; font-size:14px; } button{ cursor:pointer; } button.active{ background:#222; color:#fff; } input{ flex:1 1 180px; min-width:0; outline:none; } /* ========================= 图库 ========================= */ main{ width:100%; max-width:900px; margin:auto; padding:10px; } .grid{ width:100%; display:grid; grid-template-columns:1fr; gap:12px; } .card{ width:100%; overflow:hidden; background:#fff; border:1px solid #ddd; border-radius:9px; } .card img{ display:block; /* 关键： 图片永远不能超过卡片宽度 */ width:100%; max-width:100%; height:auto; object-fit:contain; cursor:zoom-in; background:#eee; } .info{ padding:8px; font-size:13px; line-height:1.5; } .links{ display:flex; flex-wrap:wrap; gap:8px; } .links a{ color:#1677ff; text-decoration:none; } #status{ text-align:center; color:#777; padding:5px 0 12px; font-size:13px; } #loadMore{ display:block; width:100%; margin:15px 0; padding:12px; } /* ========================================================= 大图查看器 ========================================================= */ #viewer{ position:fixed; inset:0; z-index:99999; display:none; /* 真正占满手机屏幕 */ width:100vw; height:100dvh; background:#000; overflow:hidden; /* 禁止浏览器自己的触摸手势干扰 */ touch-action:none; overscroll-behavior:none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); } #viewer.open{ display:block; } /* 图片舞台 */ #viewerStage{ position:absolute; left:0; top:0; width:100%; height:100%; overflow:hidden; touch-action:none; } /* 这里不使用 width:100% 也不使用 max-width:none 配合页面布局。 图片由 JS 直接计算最终宽高。 */ #viewerImage{ position:absolute; left:50%; top:50%; display:block; width:auto; height:auto; max-width:none; max-height:none; margin:0; padding:0; transform-origin:center center; user-select:none; -webkit-user-select:none; -webkit-user-drag:none; touch-action:none; will-change:transform; } /* 关闭按钮 */ #viewerClose{ position:absolute; z-index:10; top:calc(10px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right)); width:42px; height:42px; padding:0; border:0; border-radius:50%; background:rgba(255,255,255,.2); color:#fff; font-size:28px; line-height:42px; } /* 提示 */ #viewerHint{ position:absolute; z-index:10; left:50%; bottom:calc(10px + env(safe-area-inset-bottom)); transform:translateX(-50%); padding:6px 11px; border-radius:20px; background:rgba(0,0,0,.55); color:rgba(255,255,255,.8); font-size:12px; white-space:nowrap; pointer-events:none; } /* ========================= 手机 ========================= */ @media(max-width:600px){ header{ padding:9px 7px; } header h1{ font-size:20px; margin-bottom:8px; } button, input{ font-size:13px; min-height:36px; padding:7px 9px; } main{ padding:7px; } .grid{ gap:9px; } .card{ border-radius:7px; } .info{ padding:7px; } } </style> </head> <body> <header> <h1>🌿 Echidna Gallery</h1> <div class="controls"> <div class="row"> <button class="rating active" data-rating="all">全部</button> <button class="rating" data-rating="safe">SFW</button> <button class="rating" data-rating="nsfw">NSFW</button> <button id="blockedBtn">🚫 已拉黑</button> <button id="clearBlocked">清空拉黑</button> </div> <div class="row"> <button class="category active" data-cat="all">全部</button> <button class="category" data-cat="solo">单人</button> <button class="category" data-cat="multiple">多人</button> <button class="category" data-cat="swimsuit">泳装</button> <button class="category" data-cat="maid">女仆</button> <button class="category" data-cat="kimono">和服</button> <button class="category" data-cat="school">校服</button> <button class="category" data-cat="comic">漫画</button> <button class="category" data-cat="cosplay">Cosplay</button> </div> <div class="row"> <input id="tagSearch" placeholder="输入标签，例如 swimsuit"> <button id="searchBtn">搜索</button> <button id="resetBtn">重置</button> </div> </div> </header> <main> <div id="status">准备加载…</div> <div id="grid" class="grid"></div> <button id="loadMore">加载更多</button> </main> <!-- ========================= 大图查看器 ========================= --> <div id="viewer"> <button id="viewerClose">×</button> <div id="viewerStage"> <img id="viewerImage" draggable="false"> </div> <div id="viewerHint"> 双指缩放 · 单指拖动 · 双击放大 </div> </div> <script> /* ========================================================= Danbooru ========================================================= */ const API = "https://danbooru.donmai.us/posts.json"; const MAIN_TAG = "echidna_%28re:zero%29"; const PER_PAGE = 100; const PAGES_PER_CLICK = 5; let page = 1; let posts = []; let ratingFilter = "all"; let categoryFilter = "all"; let searchTag = ""; let showBlocked = false; const blockedKey = "echidnaBlockedIds"; let blockedIds = JSON.parse( localStorage.getItem(blockedKey) || "[]" ); /* ========================================================= 基础 ========================================================= */ const grid = document.getElementById("grid"); const status = document.getElementById("status"); function saveBlocked(){ localStorage.setItem( blockedKey, JSON.stringify(blockedIds) ); } function isBlocked(id){ return blockedIds.includes( String(id) ); } function getRating(post){ if( post.rating === "s" || post.rating === "g" ){ return "safe"; } return "nsfw"; } function getTags(post){ return " " + (post.tag_string || "") + " "; } function matchCategory(post){ if(categoryFilter === "all"){ return true; } const tags = getTags(post); if(categoryFilter === "solo"){ return tags.includes(" solo "); } if(categoryFilter === "multiple"){ return ( tags.includes(" multiple_girls ") || tags.includes(" multiple_boys ") || tags.includes(" multiple_person ") || tags.includes(" group ") ); } if(categoryFilter === "swimsuit"){ return ( tags.includes(" swimsuit ") || tags.includes(" bikini ") ); } if(categoryFilter === "maid"){ return tags.includes(" maid "); } if(categoryFilter === "kimono"){ return ( tags.includes(" kimono ") || tags.includes(" yukata ") ); } if(categoryFilter === "school"){ return ( tags.includes(" school_uniform ") || tags.includes(" serafuku ") || tags.includes(" seifuku ") ); } if(categoryFilter === "comic"){ return ( tags.includes(" comic ") || tags.includes(" comic_page ") || tags.includes(" manga ") ); } if(categoryFilter === "cosplay"){ return tags.includes(" cosplay "); } return true; } function shouldShow(post){ if(showBlocked){ if(!isBlocked(post.id)){ return false; } }else{ if(isBlocked(post.id)){ return false; } } if( ratingFilter !== "all" && getRating(post) !== ratingFilter ){ return false; } if(!matchCategory(post)){ return false; } if(searchTag){ const tags = (post.tag_string || "").toLowerCase(); if( !tags.includes( searchTag.toLowerCase() ) ){ return false; } } return true; } /* ========================================================= 渲染 ========================================================= */ function render(){ grid.innerHTML = ""; const visible = posts.filter(shouldShow); visible.forEach(post => { const card = document.createElement("div"); card.className = "card"; const img = document.createElement("img"); const imageUrl = post.large_file_url || post.file_url || post.preview_file_url; img.src = imageUrl; img.loading = "lazy"; img.dataset.full = imageUrl; img.dataset.id = post.id; card.appendChild(img); const info = document.createElement("div"); info.className = "info"; const rating = getRating(post) === "safe" ? "SFW" : "NSFW"; info.innerHTML = ` <div>ID: ${post.id}</div> <div>Rating: ${rating}</div> <div class="links"> <a href="https://danbooru.donmai.us/posts/${post.id}" target="_blank" rel="noopener" > Original Post </a> ${ post.source ? ` <a href="${post.source}" target="_blank" rel="noopener" > Source </a> ` : "" } <a href="#" class="blockBtn" data-id="${post.id}" > 🚫 拉黑 </a> </div> `; card.appendChild(info); grid.appendChild(card); }); status.textContent = `显示 ${visible.length} 张 · 已加载 ${posts.length} 张`; } /* ========================================================= 图片点击 / 拉黑 ========================================================= */ grid.addEventListener( "click", e => { const blockBtn = e.target.closest(".blockBtn"); if(blockBtn){ e.preventDefault(); const id = String(blockBtn.dataset.id); if(!blockedIds.includes(id)){ blockedIds.push(id); } saveBlocked(); render(); return; } const img = e.target.closest(".card img"); if(img){ openViewer( img.dataset.full ); } }); /* ========================================================= 拉黑 ========================================================= */ document .getElementById("clearBlocked") .addEventListener( "click", () => { blockedIds = []; saveBlocked(); showBlocked = false; document .getElementById("blockedBtn") .textContent = "🚫 已拉黑"; render(); }); document .getElementById("blockedBtn") .addEventListener( "click", () => { showBlocked = !showBlocked; document .getElementById("blockedBtn") .textContent = showBlocked ? "返回图库" : "🚫 已拉黑"; render(); }); /* ========================================================= 筛选 ========================================================= */ document .querySelectorAll(".rating") .forEach(btn => { btn.addEventListener( "click", () => { document .querySelectorAll(".rating") .forEach(b => b.classList.remove("active") ); btn.classList.add("active"); ratingFilter = btn.dataset.rating; render(); }); }); document .querySelectorAll(".category") .forEach(btn => { btn.addEventListener( "click", () => { document .querySelectorAll(".category") .forEach(b => b.classList.remove("active") ); btn.classList.add("active"); categoryFilter = btn.dataset.cat; render(); }); }); document .getElementById("searchBtn") .addEventListener( "click", () => { searchTag = document .getElementById("tagSearch") .value .trim(); render(); }); document .getElementById("resetBtn") .addEventListener( "click", () => { searchTag = ""; document .getElementById("tagSearch") .value = ""; render(); }); /* ========================================================= 加载 ========================================================= */ async function loadMore(){ status.textContent = "正在加载…"; const startPage = page; let newPosts = []; try{ for( let p = startPage; p < startPage + PAGES_PER_CLICK; p++ ){ const url = `${API}?tags=${MAIN_TAG}&limit=${PER_PAGE}&page=${p}`; const response = await fetch(url); if(!response.ok){ throw new Error( "API error" ); } const data = await response.json(); newPosts.push( ...data ); if( data.length < PER_PAGE ){ break; } } page += PAGES_PER_CLICK; const map = new Map(); [ ...posts, ...newPosts ].forEach(post => { map.set( post.id, post ); }); posts = [...map.values()]; render(); }catch(error){ console.error(error); status.textContent = "加载失败，请稍后重试"; } } document .getElementById("loadMore") .addEventListener( "click", loadMore ); /* ========================================================= 真正的手机大图查看器 ========================================================= */ const viewer = document.getElementById("viewer"); const viewerStage = document.getElementById("viewerStage"); const viewerImage = document.getElementById("viewerImage"); const viewerClose = document.getElementById("viewerClose"); /* imageWidth / imageHeight = 图片原始尺寸 fitScale = 图片完整放进手机屏幕所需要的比例 scale = 当前用户实际放大的倍数 */ let fitScale = 1; let scale = 1; let translateX = 0; let translateY = 0; /* 手指 */ const pointers = new Map(); let pinchStartDistance = 0; let pinchStartScale = 1; let dragStartX = 0; let dragStartY = 0; let dragStartTranslateX = 0; let dragStartTranslateY = 0; /* 双击 */ let lastTapTime = 0; let lastTapX = 0; let lastTapY = 0; /* ========================================================= 计算“完整显示” ========================================================= */ function calculateFitScale(){ const screenWidth = viewerStage.clientWidth; const screenHeight = viewerStage.clientHeight; const imageWidth = viewerImage.naturalWidth; const imageHeight = viewerImage.naturalHeight; if( !imageWidth || !imageHeight ){ return 1; } /* 这里就是核心。 图片必须同时满足： 图片宽 <= 手机屏幕宽 AND 图片高 <= 手机屏幕高 所以一定不会被左右或上下裁掉。 */ const widthScale = screenWidth / imageWidth; const heightScale = screenHeight / imageHeight; fitScale = Math.min( widthScale, heightScale ); /* 不强制放大小图。 */ fitScale = Math.min( fitScale, 1 ); return fitScale; } /* ========================================================= 更新图片 ========================================================= */ function updateViewerImage(){ const finalScale = fitScale * scale; viewerImage.style.transform = ` translate(-50%, -50%) translate( ${translateX}px, ${translateY}px ) scale(${finalScale}) `; } /* ========================================================= 打开 ========================================================= */ function openViewer(url){ viewer.classList.add("open"); document.body.classList.add( "no-scroll" ); /* 每次打开都从“完整显示”开始 */ scale = 1; translateX = 0; translateY = 0; viewerImage.onload = () => { /* 等浏览器真正拿到原图尺寸 后再计算。 */ calculateFitScale(); scale = 1; translateX = 0; translateY = 0; updateViewerImage(); }; viewerImage.src = url; } /* ========================================================= 关闭 ========================================================= */ function closeViewer(){ viewer.classList.remove( "open" ); document.body.classList.remove( "no-scroll" ); pointers.clear(); viewerImage.src = ""; } viewerClose.addEventListener( "click", closeViewer ); /* 点击黑色区域关闭 */ viewer.addEventListener( "click", e => { if( e.target === viewer || e.target === viewerStage ){ closeViewer(); } }); /* ========================================================= 限制拖动范围 ========================================================= */ function clampPosition(){ const finalScale = fitScale * scale; const imageWidth = viewerImage.naturalWidth * finalScale; const imageHeight = viewerImage.naturalHeight * finalScale; const screenWidth = viewerStage.clientWidth; const screenHeight = viewerStage.clientHeight; /* 图片比屏幕宽多少， 就允许左右移动多少的一半。 */ const maxX = Math.max( 0, (imageWidth - screenWidth) / 2 ); const maxY = Math.max( 0, (imageHeight - screenHeight) / 2 ); translateX = Math.max( -maxX, Math.min( maxX, translateX ) ); translateY = Math.max( -maxY, Math.min( maxY, translateY ) ); } /* ========================================================= Pointer Down ========================================================= */ viewerStage.addEventListener( "pointerdown", e => { e.preventDefault(); pointers.set( e.pointerId, { x:e.clientX, y:e.clientY } ); viewerStage.setPointerCapture( e.pointerId ); if( pointers.size === 1 ){ dragStartX = e.clientX; dragStartY = e.clientY; dragStartTranslateX = translateX; dragStartTranslateY = translateY; } if( pointers.size === 2 ){ const p = [...pointers.values()]; pinchStartDistance = Math.hypot( p[0].x - p[1].x, p[0].y - p[1].y ); pinchStartScale = scale; } }, { passive:false } ); /* ========================================================= Pointer Move ========================================================= */ viewerStage.addEventListener( "pointermove", e => { if( !pointers.has( e.pointerId ) ){ return; } e.preventDefault(); pointers.set( e.pointerId, { x:e.clientX, y:e.clientY } ); /* 双指 */ if( pointers.size === 2 ){ const p = [...pointers.values()]; const distance = Math.hypot( p[0].x - p[1].x, p[0].y - p[1].y ); if( pinchStartDistance > 0 ){ scale = pinchStartScale * ( distance / pinchStartDistance ); /* 最小 = 完整显示 最大 = 6倍 */ scale = Math.max( 1, Math.min( 6, scale ) ); clampPosition(); updateViewerImage(); } return; } /* 单指拖动 */ if( pointers.size === 1 && scale > 1 ){ translateX = dragStartTranslateX + ( e.clientX - dragStartX ); translateY = dragStartTranslateY + ( e.clientY - dragStartY ); clampPosition(); updateViewerImage(); } }, { passive:false } ); /* ========================================================= Pointer Up ========================================================= */ function pointerUp(e){ pointers.delete( e.pointerId ); } viewerStage.addEventListener( "pointerup", pointerUp ); viewerStage.addEventListener( "pointercancel", pointerUp ); /* ========================================================= 双击 ========================================================= */ viewerStage.addEventListener( "pointerup", e => { if( pointers.size !== 0 ){ return; } const now = Date.now(); const dx = e.clientX - lastTapX; const dy = e.clientY - lastTapY; const distance = Math.hypot(dx,dy); if( now - lastTapTime < 300 && distance < 40 ){ if(scale === 1){ /* 双击后放大 2.5 倍 */ scale = 2.5; }else{ /* 再双击恢复完整显示 */ scale = 1; translateX = 0; translateY = 0; } clampPosition(); updateViewerImage(); } lastTapTime = now; lastTapX = e.clientX; lastTapY = e.clientY; }, { passive:false }); /* ========================================================= 手机旋转 ========================================================= */ window.addEventListener( "resize", () => { if( !viewer.classList.contains( "open" ) ){ return; } /* 手机横竖屏改变后， 重新计算“完整显示比例”。 直接回到完整显示， 不留下旧的裁切状态。 */ calculateFitScale(); scale = 1; translateX = 0; translateY = 0; updateViewerImage(); }); /* ========================================================= ESC ========================================================= */ document.addEventListener( "keydown", e => { if( e.key === "Escape" && viewer.classList.contains( "open" ) ){ closeViewer(); } }); /* ========================================================= 开始 ========================================================= */ loadMore(); </script> </body> </html>
